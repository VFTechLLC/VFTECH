# Publishes the assembled site to the live repo iamabotama/vftech.io (served by GitHub Pages)
# after "Site checks" passes on main. site/ (design 1) is the site root; design-2/ to design-10/
# publish at /design-N/ as noindexed alternates, exactly as scripts/assemble.sh builds them.
# The live URL is set once, in SITE_URL and BASE_PATH below. For a custom domain (e.g. vftech.io):
# SITE_URL: https://vftech.io, BASE_PATH: /, and uncomment the cname line.
#
# One-time setup:
#   1. In iamabotama/vftech.io: Settings → Deploy keys → add the public key, "Allow write access".
#   2. In iamabotama/VFTECH: Settings → Secrets and variables → Actions → secret LIVE_DEPLOY_KEY
#      = the matching private key.
#   3. In iamabotama/vftech.io: Settings → Pages → Source: "Deploy from a branch", branch main, / (root).
name: Deploy to live site (vftech.io)

on:
  workflow_run:
    workflows: ["Site checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs always deploy; automatic runs only when checks passed on a push to main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit the checks ran against.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble the site
        env:
          SITE_URL: https://iamabotama.github.io/vftech.io
          BASE_PATH: /vftech.io/
        run: bash scripts/assemble.sh ${{ github.run_number }}

      - name: Push to iamabotama/vftech.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.LIVE_DEPLOY_KEY }}
          external_repository: iamabotama/vftech.io
          publish_branch: main
          publish_dir: ./_site
          # cname: vftech.io   # uncomment if vftech.io is the custom domain
          user_name: vftech-deploy[bot]
          user_email: vftech-deploy@users.noreply.github.com
          full_commit_message: "Deploy VFTECH@${{ github.event.workflow_run.head_sha || github.sha }}"
