<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{subject}}</title>
<!-- VF Tech OUTBOUND base: every email sent to customers. {{content}} is one email from emails/<name>.json,
     rendered by backend/mailer.js. Light mode is fully inline; <style> only adds dark mode and the phone layout.
     The logo is black, so its header band stays white in dark mode too. -->
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  @media (prefers-color-scheme: dark) {
    .em-page { background-color: #0c1013 !important; }
    .em-card { background-color: #141b20 !important; border-color: #283237 !important; }
    .em-h { color: #ecf1f2 !important; }
    .em-t { color: #c9d2d5 !important; }
    .em-m { color: #9dabb2 !important; }
    .em-panel { background-color: #0e1215 !important; border-color: #283237 !important; }
    .em-foot { background-color: #0e1215 !important; border-color: #283237 !important; }
    .em-link { color: #8cc6e6 !important; }
    .em-line { border-color: #283237 !important; }
    .em-btn { background-color: #8cc6e6 !important; }
    .em-btn a { color: #0c1013 !important; }
  }
  [data-ogsc] .em-h { color: #ecf1f2 !important; }
  [data-ogsc] .em-t { color: #c9d2d5 !important; }
  [data-ogsc] .em-m { color: #9dabb2 !important; }
  [data-ogsc] .em-link { color: #8cc6e6 !important; }
  [data-ogsb] .em-page { background-color: #0c1013 !important; }
  [data-ogsb] .em-card { background-color: #141b20 !important; }
  [data-ogsb] .em-panel { background-color: #0e1215 !important; }
  [data-ogsb] .em-foot { background-color: #0e1215 !important; }
  @media only screen and (max-width: 480px) {
    .em-pad { padding-left: 20px !important; padding-right: 20px !important; }
    .em-col { display: block !important; width: 100% !important; text-align: left !important; padding-top: 6px !important; }
  }
</style>
</head>
<body class="em-page" style="margin:0;padding:0;background-color:#f3f4f1;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#f3f4f1;">{{preheader}}&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>

<table role="presentation" class="em-page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f4f1" style="background-color:#f3f4f1;">
<tr>
<td align="center" style="padding:28px 12px;">

<!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" class="em-card" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fafaf8" style="max-width:600px;width:100%;background-color:#fafaf8;border:1px solid #cdd2d3;">

<!-- Header: logo on a white band (kept white in dark mode), and the site's main menu -->
<tr>
<td class="em-pad" bgcolor="#ffffff" style="background-color:#ffffff;padding:22px 36px 18px 36px;border-bottom:3px solid #2a6889;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="vertical-align:middle;">
<a href="{{link_home}}" style="text-decoration:none;"><img src="{{logo_url}}" width="140" height="43" alt="VF Tech" style="display:block;width:140px;max-width:140px;height:auto;border:0;color:#14181b;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;"></a>
</td>
<td class="em-col" align="right" style="vertical-align:middle;font-family:Menlo,Consolas,'Courier New',monospace;font-size:12px;line-height:1.9;">
<a href="{{link_websites}}" style="color:#14181b;text-decoration:none;padding-left:10px;white-space:nowrap;">Websites</a>
<a href="{{link_ai}}" style="color:#14181b;text-decoration:none;padding-left:10px;white-space:nowrap;">AI</a>
<a href="{{link_advisory}}" style="color:#14181b;text-decoration:none;padding-left:10px;white-space:nowrap;">Advisory</a>
<a href="{{link_account}}" style="color:#2a6889;text-decoration:none;padding-left:10px;white-space:nowrap;font-weight:700;">Your account</a>
</td>
</tr>
</table>
</td>
</tr>

<!-- Body: the email's own content -->
<tr>
<td class="em-pad" style="padding:32px 36px 28px 36px;">
{{content}}
</td>
</tr>

<!-- Footer: what VF Tech is, the site's footer links, why you got this -->
<tr>
<td class="em-foot em-pad" bgcolor="#f3f4f1" style="background-color:#f3f4f1;padding:22px 36px;border-top:1px solid #cdd2d3;font-family:Arial,Helvetica,sans-serif;">
<p class="em-t" style="margin:0 0 4px 0;font-size:13px;color:#4b5459;line-height:1.6;">
<strong class="em-h" style="color:#14181b;">VF Tech</strong> &middot; We modernize services, systems and technology with AI.
</p>
<p class="em-t" style="margin:0 0 12px 0;font-size:13px;color:#4b5459;line-height:1.6;">
<a class="em-link" href="mailto:{{contact_email}}" style="color:#2a6889;text-decoration:none;">{{contact_email}}</a>
</p>
<p style="margin:0 0 12px 0;font-family:Menlo,Consolas,'Courier New',monospace;font-size:12px;line-height:2;">
<a class="em-link" href="{{link_process}}" style="color:#2a6889;text-decoration:none;margin-right:12px;white-space:nowrap;">How we work</a>
<a class="em-link" href="{{link_pricing}}" style="color:#2a6889;text-decoration:none;margin-right:12px;white-space:nowrap;">Pricing</a>
<a class="em-link" href="{{link_about}}" style="color:#2a6889;text-decoration:none;margin-right:12px;white-space:nowrap;">About</a>
<a class="em-link" href="{{link_contact}}" style="color:#2a6889;text-decoration:none;margin-right:12px;white-space:nowrap;">Contact</a>
<a class="em-link" href="{{link_help}}" style="color:#2a6889;text-decoration:none;white-space:nowrap;">Can't sign in?</a>
</p>
<p class="em-m" style="margin:0;font-size:11px;color:#4b5459;line-height:1.6;">
{{footer_note}}<br>
<a class="em-m" href="{{link_terms}}" style="color:#4b5459;">Terms</a> &nbsp;&middot;&nbsp; <a class="em-m" href="{{link_home}}" style="color:#4b5459;">{{site_host}}</a> &nbsp;&middot;&nbsp; Your code, your accounts, your documentation.
</p>
</td>
</tr>

</table>
<!--[if mso]></td></tr></table><![endif]-->

</td>
</tr>
</table>
</body>
</html>
